<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="511" viewBox="0 0 1120 511" role="img" aria-labelledby="library-title library-desc"><title id="library-title">Safari 本地书签设置入口</title><desc id="library-desc">中文操作示意图，使用虚构内容，实际控件位置以浏览器为准。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="1120" height="511" rx="18" fill="#f0f3f8" stroke="#f0f3f8"/><rect x="34" y="26" width="1052" height="414" rx="12" fill="#ffffff" stroke="#dbe3ee"/><rect x="34" y="26" width="1052" height="46" rx="12" fill="#f8faff" stroke="#dbe3ee"/><path d="M34 72L1086 72" stroke="#dbe3ee" stroke-width="2" fill="none"/><circle cx="55" cy="49" r="5" fill="#e5a2a1"/><circle cx="75" cy="49" r="5" fill="#e3cc8d"/><circle cx="95" cy="49" r="5" fill="#a8cbb6"/><text x="125" y="56" font-size="18" fill="#68758a" font-weight="500">设置 &gt; 本地书签 · 数据来源示意</text><text x="64" y="121" font-size="27" fill="#24344b" font-weight="650">当前数据源：本地导入库</text><text x="64" y="160" font-size="20" fill="#68758a" font-weight="400">本地副本与 Safari 原书签分开保存</text><rect x="63" y="195" width="270" height="42" rx="8" fill="#4c72aa" stroke="#4c72aa"/><text x="77" y="222" font-size="18" fill="#fff" font-weight="600">导入书签 HTML</text><rect x="349" y="195" width="252" height="42" rx="8" fill="#ffffff" stroke="#dbe3ee"/><text x="363" y="222" font-size="18" fill="#24344b" font-weight="600">导出本地书签</text><rect x="63" y="266" width="993" height="129" rx="10" fill="#edf3ff" stroke="#edf3ff"/><text x="83" y="301" font-size="21" fill="#4c72aa" font-weight="600">开启实验原生同步后，在这里查看：</text><text x="83" y="337" font-size="20" fill="#4c72aa" font-weight="400">连接状态  ·  上次成功同步时间  ·  同步中或失败原因</text><text x="83" y="373" font-size="18" fill="#68758a" font-weight="400">同步设置在 macOS App 的“书签同步（可选）”面板中完成</text><text x="53" y="483" font-size="18" fill="#68758a" font-weight="400">导出本地书签不包含原生同步快照、配置、待办、隐藏项和回收站。</text></svg>
