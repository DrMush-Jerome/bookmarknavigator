<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="512" viewBox="0 0 1120 512" role="img" aria-labelledby="safari-unsigned-title safari-unsigned-desc"><title id="safari-unsigned-title">Safari 允许未签名扩展的位置</title><desc id="safari-unsigned-desc">中文操作示意图，使用虚构内容，实际控件位置以浏览器为准。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="1120" height="512" rx="18" fill="#f0f3f8" stroke="#f0f3f8"/><rect x="33" y="27" width="502" height="375" rx="12" fill="#ffffff" stroke="#dbe3ee"/><rect x="33" y="27" width="502" height="46" rx="12" fill="#f8faff" stroke="#dbe3ee"/><path d="M33 73L535 73" stroke="#dbe3ee" stroke-width="2" fill="none"/><circle cx="54" cy="50" r="5" fill="#e5a2a1"/><circle cx="74" cy="50" r="5" fill="#e3cc8d"/><circle cx="94" cy="50" r="5" fill="#a8cbb6"/><text x="124" y="57" font-size="18" fill="#68758a" font-weight="500">Safari 设置 · 高级</text><text x="60" y="120" font-size="27" fill="#24344b" font-weight="650">高级</text><rect x="64" y="164" width="22" height="22" rx="5" fill="#4c72aa" stroke="#4c72aa"/><path d="M69 175l4 4 8-9" fill="none" stroke="#fff" stroke-width="2.5"/><text x="98" y="182" font-size="21" fill="#24344b" font-weight="400">显示网页开发者功能</text><circle cx="480" cy="179" r="17" fill="#4c72aa"/><text text-anchor="middle" x="480" y="185" font-size="18" fill="#fff" font-weight="700">1</text><text x="64" y="228" font-size="18" fill="#68758a" font-weight="400">首次设置：打开开发者选项</text><rect x="585" y="27" width="502" height="375" rx="12" fill="#ffffff" stroke="#dbe3ee"/><rect x="585" y="27" width="502" height="46" rx="12" fill="#f8faff" stroke="#dbe3ee"/><path d="M585 73L1087 73" stroke="#dbe3ee" stroke-width="2" fill="none"/><circle cx="606" cy="50" r="5" fill="#e5a2a1"/><circle cx="626" cy="50" r="5" fill="#e3cc8d"/><circle cx="646" cy="50" r="5" fill="#a8cbb6"/><text x="676" y="57" font-size="18" fill="#68758a" font-weight="500">Safari 设置 · 开发者</text><text x="612" y="120" font-size="27" fill="#24344b" font-weight="650">开发者</text><rect x="615" y="164" width="22" height="22" rx="5" fill="#4c72aa" stroke="#4c72aa"/><path d="M620 175l4 4 8-9" fill="none" stroke="#fff" stroke-width="2.5"/><text x="649" y="182" font-size="21" fill="#24344b" font-weight="400">允许未签名的扩展</text><circle cx="1034" cy="179" r="17" fill="#4c72aa"/><text text-anchor="middle" x="1034" y="185" font-size="18" fill="#fff" font-weight="700">2</text><text x="615" y="229" font-size="18" fill="#68758a" font-weight="400">在系统窗口完成验证</text><path d="M546 185L575 185" stroke="#4c72aa" stroke-width="3" fill="none"/><path d="M565 178L575 185L565 192" stroke="#4c72aa" fill="none" stroke-width="3"/><rect x="63" y="277" width="444" height="88" rx="10" fill="#edf3ff" stroke="#edf3ff"/><text x="81" y="309" font-size="18" fill="#4c72aa" font-weight="400">Safari 17+：使用“开发者”设置</text><text x="81" y="337" font-size="18" fill="#4c72aa" font-weight="400">Safari 16：使用菜单栏“开发”</text><text x="56" y="449" font-size="19" fill="#24344b" font-weight="600">完全退出 Safari 后，此选项重置。下次启动重新勾选即可，无需重装 App。</text><text x="57" y="484" font-size="17" fill="#68758a" font-weight="400">这是免费测试包的使用步骤；项目没有永久保留此选项的可靠方法。</text></svg>
