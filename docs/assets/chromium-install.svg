<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="551" viewBox="0 0 1120 551" role="img" aria-labelledby="chromium-install-title chromium-install-desc"><title id="chromium-install-title">Chrome 与 Edge 的本地安装步骤</title><desc id="chromium-install-desc">中文操作示意图，使用虚构内容，实际控件位置以浏览器为准。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="1120" height="551" rx="18" fill="#f0f3f8" stroke="#f0f3f8"/><rect x="32" y="24" width="1056" height="464" rx="12" fill="#ffffff" stroke="#dbe3ee"/><rect x="32" y="24" width="1056" height="46" rx="12" fill="#f8faff" stroke="#dbe3ee"/><path d="M32 70L1088 70" stroke="#dbe3ee" stroke-width="2" fill="none"/><circle cx="53" cy="47" r="5" fill="#e5a2a1"/><circle cx="73" cy="47" r="5" fill="#e3cc8d"/><circle cx="93" cy="47" r="5" fill="#a8cbb6"/><text x="123" y="54" font-size="18" fill="#68758a" font-weight="500">chrome://extensions  或  edge://extensions</text><text x="63" y="109" font-size="27" fill="#24344b" font-weight="650">扩展程序</text><text x="840" y="104" font-size="19" fill="#24344b" font-weight="400">开发者模式</text><rect x="987" y="84" width="44" height="24" rx="12" fill="#4c72aa" stroke="#4c72aa"/><circle cx="1018" cy="96" r="9" fill="#fff"/><circle cx="1049" cy="97" r="17" fill="#4c72aa"/><text text-anchor="middle" x="1049" y="103" font-size="18" fill="#fff" font-weight="700">1</text><rect x="62" y="137" width="257" height="42" rx="8" fill="#4c72aa" stroke="#4c72aa"/><text x="76" y="164" font-size="18" fill="#fff" font-weight="600">加载已解压的扩展程序</text><circle cx="343" cy="158" r="17" fill="#4c72aa"/><text text-anchor="middle" x="343" y="164" font-size="18" fill="#fff" font-weight="700">2</text><rect x="63" y="211" width="374" height="174" rx="12" fill="#f9fbfe" stroke="#dbe3ee"/><rect x="85" y="233" width="52" height="52" rx="11" fill="#edf3ff" stroke="#dbe3ee"/><text x="102" y="266" font-size="30" fill="#4c72aa" font-weight="400">▯</text><text x="153" y="254" font-size="22" fill="#24344b" font-weight="650">书签导航台</text><text x="153" y="282" font-size="16" fill="#68758a" font-weight="400">1.13.2 · 已启用</text><text x="85" y="348" font-size="17" fill="#68758a" font-weight="400">详情       移除       重新加载</text><rect x="355" y="328" width="44" height="24" rx="12" fill="#4c72aa" stroke="#4c72aa"/><circle cx="386" cy="340" r="9" fill="#fff"/><rect x="486" y="166" width="563" height="280" rx="12" fill="#ffffff" stroke="#dbe3ee"/><rect x="486" y="166" width="563" height="46" rx="12" fill="#f8faff" stroke="#dbe3ee"/><path d="M486 212L1049 212" stroke="#dbe3ee" stroke-width="2" fill="none"/><circle cx="507" cy="189" r="5" fill="#e5a2a1"/><circle cx="527" cy="189" r="5" fill="#e3cc8d"/><circle cx="547" cy="189" r="5" fill="#a8cbb6"/><text x="577" y="196" font-size="18" fill="#68758a" font-weight="500">选择刚才解压出来的文件夹</text><text x="511" y="247" font-size="19" fill="#68758a" font-weight="400">文档 / 书签导航台</text><rect x="510" y="267" width="515" height="39" rx="7" fill="#edf3ff" stroke="#edf3ff"/><text x="527" y="293" font-size="19" fill="#4c72aa" font-weight="600">▸  解压后的 Chrome 文件夹</text><text x="527" y="335" font-size="18" fill="#68758a" font-weight="400">选中文件夹，再点击下方按钮</text><rect x="831" y="383" width="193" height="42" rx="8" fill="#4c72aa" stroke="#4c72aa"/><text x="845" y="410" font-size="18" fill="#fff" font-weight="600">选择文件夹</text><circle cx="1013" cy="248" r="17" fill="#4c72aa"/><text text-anchor="middle" x="1013" y="254" font-size="18" fill="#fff" font-weight="700">3</text><text x="63" y="464" font-size="19" fill="#24344b" font-weight="600">4  打开一个新标签页，确认显示“书签导航台”</text><text x="45" y="529" font-size="18" fill="#68758a" font-weight="400">下载 ZIP → 解压 → 开启开发者模式 → 选择刚才解压出来的文件夹</text></svg>
