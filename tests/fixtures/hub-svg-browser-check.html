<!doctype html><meta charset="utf-8"><title>本地 SVG 安全解码检查</title><h1>本地 SVG 安全解码检查</h1><pre id="results">运行中</pre><script>window.module={exports:{}};</script><script src="/hires-icons.js"></script><script>
(async()=>{const {safeSVG,decodeRaster}=module.exports;const lines=[];let passed=0;const wrap=p=>'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">'+p+'</svg>';const bad=['<script/>','<foreignObject/>','<image href="data:image/png;base64,AAAA"/>','<style>path{fill:red}</style>','<use href="https://evil.example.com/a"/>','<path fill="url(https://evil.example.com/a)"/>','<path fill="u\\72l(https://evil.example.com/a)"/>','<path style="fill:red"/>','<path onload="alert(1)"/>'];for(const part of bad){let rejected=false;try{safeSVG(wrap(part));}catch(e){rejected=e.code==='unsafe-svg';}if(!rejected)throw Error('未拒绝：'+part);passed++;lines.push('PASS 拒绝 '+part);}const data=await decodeRaster(new Blob([wrap('<defs><linearGradient id="g"><stop offset="0" stop-color="#777"/><stop offset="1" stop-color="#fff"/></linearGradient></defs><rect width="16" height="16" fill="url(#g)"/>')]),new AbortController().signal);const image=new Image();image.src=data;await image.decode();if(image.naturalWidth!==256||image.naturalHeight!==256)throw Error('矢量输出尺寸错误');passed++;lines.push('PASS 真实DOMParser + Image + canvas：内部渐变SVG转256×256 PNG');const canvas=document.createElement('canvas');canvas.width=canvas.height=32;const blob=await new Promise(r=>canvas.toBlob(r));let low=false;try{await decodeRaster(blob,new AbortController().signal);}catch(e){low=e.code==='low-resolution';}if(!low)throw Error('低清未拒绝');passed++;lines.push('PASS 32×32真实PNG拒绝，不放大');document.querySelector('#results').textContent=passed+' 项全部通过\n'+lines.join('\n');})().catch(e=>{document.querySelector('#results').textContent='FAIL '+e.stack;console.error(e);});
</script>
