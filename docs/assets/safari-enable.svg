<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="493" viewBox="0 0 1120 493" role="img" aria-labelledby="safari-enable-title safari-enable-desc"><title id="safari-enable-title">启用 Safari 扩展并设置新标签页</title><desc id="safari-enable-desc">中文操作示意图，使用虚构内容，实际控件位置以浏览器为准。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="1120" height="493" rx="18" fill="#f0f3f8" stroke="#f0f3f8"/><rect x="33" y="26" width="502" height="385" rx="12" fill="#ffffff" stroke="#dbe3ee"/><rect x="33" y="26" width="502" height="46" rx="12" fill="#f8faff" stroke="#dbe3ee"/><path d="M33 72L535 72" stroke="#dbe3ee" stroke-width="2" fill="none"/><circle cx="54" cy="49" r="5" fill="#e5a2a1"/><circle cx="74" cy="49" r="5" fill="#e3cc8d"/><circle cx="94" cy="49" r="5" fill="#a8cbb6"/><text x="124" y="56" font-size="18" fill="#68758a" font-weight="500">Safari 设置 · 扩展</text><text x="62" y="118" font-size="27" fill="#24344b" font-weight="650">扩展</text><rect x="60" y="144" width="448" height="63" rx="9" fill="#edf3ff" stroke="#edf3ff"/><rect x="80" y="165" width="22" height="22" rx="5" fill="#4c72aa" stroke="#4c72aa"/><path d="M85 176l4 4 8-9" fill="none" stroke="#fff" stroke-width="2.5"/><text x="114" y="183" font-size="22" fill="#24344b" font-weight="400">书签导航台</text><circle cx="474" cy="176" r="17" fill="#4c72aa"/><text text-anchor="middle" x="474" y="182" font-size="18" fill="#fff" font-weight="700">1</text><text x="63" y="252" font-size="18" fill="#68758a" font-weight="400">先把 App 放入应用程序并打开一次</text><text x="63" y="285" font-size="18" fill="#68758a" font-weight="400">然后在扩展列表中启用</text><rect x="585" y="26" width="502" height="385" rx="12" fill="#ffffff" stroke="#dbe3ee"/><rect x="585" y="26" width="502" height="46" rx="12" fill="#f8faff" stroke="#dbe3ee"/><path d="M585 72L1087 72" stroke="#dbe3ee" stroke-width="2" fill="none"/><circle cx="606" cy="49" r="5" fill="#e5a2a1"/><circle cx="626" cy="49" r="5" fill="#e3cc8d"/><circle cx="646" cy="49" r="5" fill="#a8cbb6"/><text x="676" y="56" font-size="18" fill="#68758a" font-weight="500">Safari 设置 · 通用</text><text x="614" y="118" font-size="27" fill="#24344b" font-weight="650">通用</text><text x="614" y="180" font-size="21" fill="#24344b" font-weight="400">新建标签页时打开：</text><rect x="613" y="198" width="445" height="55" rx="8" fill="#edf3ff" stroke="#4c72aa"/><text x="634" y="232" font-size="22" fill="#4c72aa" font-weight="600">书签导航台                     ▾</text><circle cx="1037" cy="181" r="17" fill="#4c72aa"/><text text-anchor="middle" x="1037" y="187" font-size="18" fill="#fff" font-weight="700">2</text><text x="614" y="298" font-size="18" fill="#68758a" font-weight="400">新建窗口也可设置为书签导航台</text><text x="58" y="456" font-size="20" fill="#24344b" font-weight="600">3  新建一个标签页 → 阅读首次说明 → 在设置中导入书签</text></svg>
