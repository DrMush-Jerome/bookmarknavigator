<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="578" viewBox="0 0 1120 578" role="img" aria-labelledby="safari-import-title safari-import-desc"><title id="safari-import-title">Safari 导出、解压与本地导入</title><desc id="safari-import-desc">中文操作示意图，使用虚构内容，实际控件位置以浏览器为准。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="1120" height="578" rx="18" fill="#f0f3f8" stroke="#f0f3f8"/><rect x="31" y="28" width="1058" height="52" rx="12" fill="#ffffff" stroke="#dbe3ee"/><rect x="31" y="28" width="1058" height="46" rx="12" fill="#f8faff" stroke="#dbe3ee"/><path d="M31 74L1089 74" stroke="#dbe3ee" stroke-width="2" fill="none"/><circle cx="52" cy="51" r="5" fill="#e5a2a1"/><circle cx="72" cy="51" r="5" fill="#e3cc8d"/><circle cx="92" cy="51" r="5" fill="#a8cbb6"/><text x="122" y="58" font-size="18" fill="#68758a" font-weight="500">Safari 文件菜单 → 将浏览数据导出到文件</text><rect x="32" y="106" width="336" height="321" rx="12" fill="#ffffff" stroke="#dbe3ee"/><rect x="32" y="106" width="336" height="46" rx="12" fill="#f8faff" stroke="#dbe3ee"/><path d="M32 152L368 152" stroke="#dbe3ee" stroke-width="2" fill="none"/><circle cx="53" cy="129" r="5" fill="#e5a2a1"/><circle cx="73" cy="129" r="5" fill="#e3cc8d"/><circle cx="93" cy="129" r="5" fill="#a8cbb6"/><text x="123" y="136" font-size="18" fill="#68758a" font-weight="500">1 · 只导出书签</text><rect x="57" y="180" width="22" height="22" rx="5" fill="#4c72aa" stroke="#4c72aa"/><path d="M62 191l4 4 8-9" fill="none" stroke="#fff" stroke-width="2.5"/><text x="91" y="198" font-size="22" fill="#24344b" font-weight="400">书签</text><rect x="57" y="224" width="22" height="22" rx="5" fill="#ffffff" stroke="#dbe3ee"/><text x="91" y="242" font-size="19" fill="#24344b" font-weight="400">阅读列表</text><rect x="57" y="264" width="22" height="22" rx="5" fill="#ffffff" stroke="#dbe3ee"/><text x="91" y="282" font-size="19" fill="#24344b" font-weight="400">历史记录</text><rect x="57" y="304" width="22" height="22" rx="5" fill="#ffffff" stroke="#dbe3ee"/><text x="91" y="322" font-size="19" fill="#24344b" font-weight="400">信用卡和密码</text><rect x="217" y="362" width="125" height="42" rx="8" fill="#4c72aa" stroke="#4c72aa"/><text x="231" y="389" font-size="18" fill="#fff" font-weight="600">导出</text><rect x="395" y="106" width="322" height="321" rx="12" fill="#ffffff" stroke="#dbe3ee"/><rect x="395" y="106" width="322" height="46" rx="12" fill="#f8faff" stroke="#dbe3ee"/><path d="M395 152L717 152" stroke="#dbe3ee" stroke-width="2" fill="none"/><circle cx="416" cy="129" r="5" fill="#e5a2a1"/><circle cx="436" cy="129" r="5" fill="#e3cc8d"/><circle cx="456" cy="129" r="5" fill="#a8cbb6"/><text x="486" y="136" font-size="18" fill="#68758a" font-weight="500">2 · 解压 ZIP</text><rect x="470" y="183" width="90" height="89" rx="13" fill="#edf3ff" stroke="#edf3ff"/><text x="492" y="235" font-size="28" fill="#4c72aa" font-weight="650">ZIP</text><text x="417" y="309" font-size="20" fill="#24344b" font-weight="600">解压后选择 HTML 文件</text><text x="419" y="342" font-size="19" fill="#68758a" font-weight="400">示例：书签.html</text><rect x="744" y="106" width="344" height="321" rx="12" fill="#ffffff" stroke="#dbe3ee"/><rect x="744" y="106" width="344" height="46" rx="12" fill="#f8faff" stroke="#dbe3ee"/><path d="M744 152L1088 152" stroke="#dbe3ee" stroke-width="2" fill="none"/><circle cx="765" cy="129" r="5" fill="#e5a2a1"/><circle cx="785" cy="129" r="5" fill="#e3cc8d"/><circle cx="805" cy="129" r="5" fill="#a8cbb6"/><text x="835" y="136" font-size="18" fill="#68758a" font-weight="500">3 · 导入导航台</text><text x="764" y="185" font-size="22" fill="#24344b" font-weight="650">设置 &gt; 本地书签</text><rect x="764" y="214" width="300" height="42" rx="8" fill="#4c72aa" stroke="#4c72aa"/><text x="778" y="241" font-size="18" fill="#fff" font-weight="600">导入书签 HTML</text><text x="764" y="290" font-size="18" fill="#68758a" font-weight="400">选择刚解压得到的 HTML</text><text x="764" y="326" font-size="18" fill="#68758a" font-weight="400">出现“导入 · 文件名”目录</text><path d="M372 250L390 250" stroke="#4c72aa" stroke-width="3" fill="none"/><path d="M380 243L390 250L380 257" stroke="#4c72aa" fill="none" stroke-width="3"/><path d="M721 250L739 250" stroke="#4c72aa" stroke-width="3" fill="none"/><path d="M729 243L739 250L729 257" stroke="#4c72aa" fill="none" stroke-width="3"/><rect x="49" y="458" width="1022" height="91" rx="12" fill="#edf3ff" stroke="#edf3ff"/><text x="71" y="491" font-size="21" fill="#4c72aa" font-weight="600">默认导入保存独立副本，整理它不会修改 Safari 原书签。</text><text x="71" y="527" font-size="18" fill="#68758a" font-weight="400">重复导入会新增文件夹；Safari 16–18 的“导出书签”可直接得到 HTML。</text></svg>
