<!doctype html><meta charset="utf-8"><title>内置Logo离线检查</title><style>body{font:14px system-ui;background:#eef1f5;color:#202226;padding:24px}#grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.tile{background:white;border-radius:14px;padding:12px;text-align:center}.tile img{width:56px;height:56px;object-fit:contain}small{display:block;color:#666}#result{white-space:pre-wrap}</style><h1>内置Logo离线检查</h1><p id="result">检查中</p><div id="grid"></div><script>
(async()=>{const data=await (await fetch('/bundled-logos-data.json')).json();const failures=[];await Promise.all(data.icons.map(async x=>{const tile=document.createElement('div');tile.className='tile';const img=new Image();img.src='/'+x.path;const label=document.createElement('p');label.textContent=x.name;const detail=document.createElement('small');detail.textContent=x.width+'×'+x.height;tile.append(img,label,detail);document.querySelector('#grid').append(tile);try{await img.decode();if(img.naturalWidth!==x.width||img.naturalHeight!==x.height||Math.min(img.naturalWidth,img.naturalHeight)<96)throw Error('尺寸不合格')}catch(e){failures.push(x.name+': '+e.message)}}));document.querySelector('#result').textContent='实际浏览器解码 '+data.icons.length+' 个资源；失败 '+failures.length+'\n'+failures.join('\n');})().catch(e=>document.querySelector('#result').textContent='FAIL '+e.stack);
</script>
