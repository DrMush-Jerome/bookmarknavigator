"/><text x="382" y="216" font-size="21" fill="#4c72aa" font-weight="650">把 App 拖到这里</text><text x="58" y="405" font-size="20" fill="#24344b" font-weight="600">3  从“应用程序”打开 App，按“安装与启用”面板完成 Safari 设置。</text></svg>
